name: vibe wave

on:
 push:
  branches:
   - main

jobs:
 deploy:
  runs-on: ubuntu-latest

  steps:
   - name: step one
     uses: actions/checkout@v4

   - name: Build Docker Image
     run: docker build -t vibe-wave ./chizzy-music-app

   - name: Tag docker image 
     run: docker tag vibe-wave ${{ secrets.DOCKERHUB_USERNAME }}/vibe-wave:latest

   - name: log in to Docker Hub 
     uses: docker/login-action@v4
     with:
      username: ${{ secrets.DOCKERHUB_USERNAME }}
      password: ${{ secrets.DOCKERHUB_TOKEN }}

   - name: push docker image 
     run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/vibe-wave:latest
     

   
   
